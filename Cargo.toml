[workspace]
resolver = "3"
members = [
  "crates/fdir-accounting",
  "crates/fdir-adapter-sdk",
  "crates/fdir-adapters",
  "crates/fdir-canonical",
  "crates/fdir-cli",
  "crates/fdir-contract",
  "crates/fdir-coordinator",
  "crates/fdir-core",
  "crates/fdir-semantics",
  "crates/fdir-storage",
  "crates/fdir-test-support",
]
default-members = ["crates/fdir-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/horiyamayoh/fdir"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
