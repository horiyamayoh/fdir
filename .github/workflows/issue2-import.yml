name: Import FDIR 2.1 normative baseline

on:
  push:
    branches:
      - agent/issue-2-normative-baseline
    paths:
      - .github/workflows/issue2-import.yml
      - .issue2/trigger
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-2-normative-baseline-import
  cancel-in-progress: false

jobs:
  import-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/issue-2-normative-baseline
      BASELINE_ARCHIVE_SHA256: f56efd9aa7f8ee80a9fbf89d54e770049a62de8b1984a7bbe516f267103cc8b3
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-2-normative-baseline
          fetch-depth: 0

      - name: Verify, import, validate, and publish the baseline
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f baseline.yaml ]]; then
            echo "FDIR 2.1 baseline is already imported; nothing to do."
            exit 0
          fi

          cat .issue2/payload/part-* \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/fdir-baseline.tar.gz
          actual_digest="$(sha256sum /tmp/fdir-baseline.tar.gz | cut -d ' ' -f1)"
          echo "FDIR baseline archive sha256: ${actual_digest}"
          test "${actual_digest}" = "${BASELINE_ARCHIVE_SHA256}"

          mkdir -p /tmp/fdir-baseline
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = "/tmp/fdir-baseline.tar.gz"
          with tarfile.open(archive, "r:gz") as handle:
              for member in handle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              handle.extractall("/tmp/fdir-baseline")
          PY
          cp -a /tmp/fdir-baseline/. .

          python3 tools/generate_contracts.py .
          python3 tools/generate_traceability.py .
          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false

          git add baseline.yaml machine spec
          git commit -m "Import FDIR 2.1 normative authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add tools schemas
          git commit -m "Generate FDIR 2.1 contracts from machine authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add examples fixtures matrices queries
          git commit -m "Add baseline fixtures and traceability validation (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add README.md .gitignore .gitattributes references diagrams
          git rm -r --ignore-unmatch .bootstrap .issue2 .github/workflows/issue2-import.yml
          git commit -m "Document baseline authority and remove bootstrap staging (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"
