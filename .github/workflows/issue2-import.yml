name: Import FDIR 2.1 normative baseline

on:
  push:
    branches:
      - agent/issue-2-normative-baseline
    paths:
      - .github/workflows/issue2-import.yml
      - .issue2/trigger
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-2-normative-baseline-import
  cancel-in-progress: false

jobs:
  import-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/issue-2-normative-baseline
      SOURCE_BRANCH: agent/issue-2-fdir-2.1-baseline
      BASELINE_ARCHIVE_SHA256: 66868d4f85d9bbd7304519d165d9c769c0cb836aa35bbaa7ec631f7dbcca3c8f
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-2-normative-baseline
          fetch-depth: 0

      - name: Verify complete normative source archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f baseline.yaml ]]; then
            echo "FDIR 2.1 baseline is already imported; nothing to do."
            exit 0
          fi

          git fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          rm -rf /tmp/fdir-source-branch
          mkdir -p /tmp/fdir-source-branch
          git archive "origin/${SOURCE_BRANCH}" .issue2/payload \
            | tar -x -C /tmp/fdir-source-branch

          mapfile -t payload_paths < <(
            find /tmp/fdir-source-branch/.issue2/payload \
              -mindepth 1 -maxdepth 1 -type f -name 'part-*' -print | sort
          )
          test "${#payload_paths[@]}" -eq 4
          for path in "${payload_paths[@]}"; do
            if grep -q '[^A-Za-z0-9+/=[:space:]]' "${path}"; then
              echo "::error file=${path}::payload contains a non-base64 character"
              exit 1
            fi
          done
          cat "${payload_paths[@]}" | base64 --decode > /tmp/fdir-2.1.0-baseline.tar.gz

          actual_digest="$(sha256sum /tmp/fdir-2.1.0-baseline.tar.gz | cut -d ' ' -f1)"
          echo "FDIR baseline archive sha256: ${actual_digest}"
          test "${actual_digest}" = "${BASELINE_ARCHIVE_SHA256}"

      - name: Extract and validate source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fdir-baseline
          mkdir -p /tmp/fdir-baseline
          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('/tmp/fdir-2.1.0-baseline.tar.gz')
          destination = Path('/tmp/fdir-baseline')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) != 57:
                  raise SystemExit(f'unexpected archive file count: {len(members)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall(destination)
          PY

          cd /tmp/fdir-baseline
          echo "Validated source package entries:"
          find . -mindepth 1 -maxdepth 2 -print | sort
          test -f baseline.yaml
          test -f machine/logical-model.yaml
          test -f tools/generate_contracts.py
          test -f tools/generate_traceability.py
          test -f tools/validate_baseline.py
          test -f references/artifact-packaging.md
          test -f .github/workflows/validate-baseline.yml

          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Publish validated source in focused commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fdir-baseline/. .

          git add README.md baseline.yaml machine \
            spec/README.md \
            spec/01-authority.md \
            spec/02-assertion-first-model.md \
            spec/03-evidence-and-accounting.md \
            spec/04-completeness-and-equivalence.md \
            spec/05-canonicalization-and-identity.md \
            spec/06-claims-and-qualification.md
          git commit -m "Import FDIR 2.1 normative authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add tools schemas spec/generated
          git commit -m "Generate FDIR 2.1 contracts from machine authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add examples fixtures matrices queries
          git commit -m "Add baseline fixtures and traceability validation (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add .gitattributes .gitignore .github/workflows/validate-baseline.yml references diagrams
          git add -A -- .bootstrap .issue2 .github/workflows/issue2-import.yml
          git commit -m "Document review artifacts and add baseline CI (#2)"

          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=no)"

          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Published validated FDIR baseline at $(git rev-parse HEAD)"
