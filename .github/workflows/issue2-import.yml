name: Import FDIR 2.1 normative baseline

on:
  push:
    branches:
      - agent/issue-2-normative-baseline
    paths:
      - .github/workflows/issue2-import.yml
      - .issue2/trigger
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-2-normative-baseline-import
  cancel-in-progress: false

jobs:
  import-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/issue-2-normative-baseline
      SOURCE_BRANCH: agent/issue-2-fdir-2.1-baseline
      SOURCE_PAYLOAD_TREE: b7d611f0961fca5afc2a9725a794b58b7c3ed4e5
      BASELINE_ARCHIVE_SHA256: 66868d4f85d9bbd7304519d165d9c769c0cb836aa35bbaa7ec631f7dbcca3c8f
      REPAIR_PART: part-001
      REPAIR_OFFSET: "7301"
      REPAIR_CHARACTER: n
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-2-normative-baseline
          fetch-depth: 0

      - name: Reconstruct and verify the pinned source archive
        shell: bash
        run: |
          set -euo pipefail

          test ! -f baseline.yaml
          git fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git cat-file -e "${SOURCE_PAYLOAD_TREE}^{tree}"

          rm -rf /tmp/fdir-source-payload
          mkdir -p /tmp/fdir-source-payload
          git archive "${SOURCE_PAYLOAD_TREE}" \
            | tar -x -C /tmp/fdir-source-payload

          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          payload_dir = Path('/tmp/fdir-source-payload')
          parts = sorted(payload_dir.glob('part-*'))
          expected_names = ['part-000', 'part-001', 'part-002', 'part-003']
          if [part.name for part in parts] != expected_names:
              raise SystemExit(f'unexpected pinned payload layout: {[part.name for part in parts]}')

          chunks = {
              part.name: ''.join(part.read_text(encoding='ascii').split())
              for part in parts
          }
          repair_part = os.environ['REPAIR_PART']
          repair_offset = int(os.environ['REPAIR_OFFSET'])
          repair_character = os.environ['REPAIR_CHARACTER']
          damaged = chunks[repair_part]
          if len(damaged) != 11999:
              raise SystemExit(f'unexpected {repair_part} length: {len(damaged)}')

          repaired = damaged[:repair_offset] + repair_character + damaged[repair_offset:]
          encoded = chunks['part-000'] + repaired + chunks['part-002'] + chunks['part-003']
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_digest = os.environ['BASELINE_ARCHIVE_SHA256']

          print(f'Pinned payload tree: {os.environ["SOURCE_PAYLOAD_TREE"]}')
          print(
              f'Restored {repair_part} character {repair_character!r} '
              f'at offset {repair_offset}'
          )
          print(f'FDIR baseline archive bytes: {len(archive)}')
          print(f'FDIR baseline archive sha256: {digest}')
          if digest != expected_digest:
              raise SystemExit(
                  f'archive digest mismatch: expected {expected_digest}, got {digest}'
              )

          Path('/tmp/fdir-2.1.0-baseline.tar.gz').write_bytes(archive)
          PY

      - name: Extract and validate the normative source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fdir-baseline
          mkdir -p /tmp/fdir-baseline

          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('/tmp/fdir-2.1.0-baseline.tar.gz')
          destination = Path('/tmp/fdir-baseline')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) != 57:
                  raise SystemExit(f'unexpected archive file count: {len(members)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall(destination)
          print(f'Extracted {len(members)} validated regular files.')
          PY

          cd /tmp/fdir-baseline
          test -f baseline.yaml
          test -f machine/logical-model.yaml
          test -f tools/generate_contracts.py
          test -f tools/generate_traceability.py
          test -f tools/validate_baseline.py
          test -f references/packaging.md
          test -f .github/workflows/validate-baseline.yml

          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Publish the validated baseline in focused commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fdir-baseline/. .

          git add README.md baseline.yaml machine \
            spec/README.md \
            spec/01-authority.md \
            spec/02-assertion-first-model.md \
            spec/03-evidence-and-accounting.md \
            spec/04-completeness-and-equivalence.md \
            spec/05-canonicalization-and-identity.md \
            spec/06-claims-and-qualification.md
          git commit -m "Import FDIR 2.1 normative authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add tools schemas spec/generated
          git commit -m "Generate FDIR 2.1 contracts from machine authority (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add examples fixtures matrices queries
          git commit -m "Add baseline fixtures and traceability validation (#2)"
          git push origin "HEAD:${TARGET_BRANCH}"

          git add .gitattributes .gitignore \
            .github/workflows/validate-baseline.yml \
            references diagrams
          git add -A -- .bootstrap .issue2 .github/workflows/issue2-import.yml
          git commit -m "Document review artifacts and add baseline CI (#2)"

          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=no)"

          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Published validated FDIR baseline at $(git rev-parse HEAD)"
