name: Finalize Issue 11 generated artifacts

on:
  push:
    branches:
      - agent/issue-11-sqlite-index

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/issue-11-sqlite-index
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup override set 1.97.1
      - name: Regenerate toolchain-owned files
        shell: bash
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          set -euo pipefail
          python3 tools/generate_contracts.py --check .
          python3 tools/generate_rust_contract.py .
          cargo generate-lockfile
          cargo fetch --locked
          cargo fmt --all
          python3 tools/generate_rust_contract.py --check .
      - name: Commit generated artifacts and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates quality
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Regenerate Rust contracts and dependency lockfile"
          git push origin HEAD:refs/heads/agent/issue-11-sqlite-index
