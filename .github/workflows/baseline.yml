name: FDIR quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdir-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup override set 1.97.1
      - name: Record pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import json, platform; policy=json.load(open('quality/toolchain.json', encoding='utf-8')); print(platform.python_implementation(), platform.python_version()); print(json.dumps(policy, sort_keys=True))"
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Fetch admitted Rust dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Run clean full repository quality
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy off .
      - name: Demonstrate intentional gate failures
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --self-test-gates .
      - name: Build authoritative cache receipt
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy read-write --receipt reports/quality/full-cache-write.json .
      - name: Verify read-only cache equivalence
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy read-only --receipt reports/quality/full-cache-read.json .
      - name: Archive machine-readable quality receipts and lockfile
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-quality-receipts-${{ github.sha }}
          path: |
            reports/quality/*.json
            .validation/quality-cache.json
            Cargo.lock
          if-no-files-found: warn
          retention-days: 90
      - name: Archive branch source for local validation
        if: always()
        shell: bash
        run: |
          tar --create --gzip \
            --file /tmp/fdir-issue-12-source.tar.gz \
            --exclude=.git \
            --exclude=.validation \
            --exclude=reports \
            .
      - name: Upload branch source for local validation
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-issue-12-source-${{ github.sha }}
          path: /tmp/fdir-issue-12-source.tar.gz
          if-no-files-found: error
          retention-days: 2
