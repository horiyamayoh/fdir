name: FDIR quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdir-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/issue-12-adapter-process-boundary
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the compile-fix commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fdir-adapter-sdk/src/protocol.rs")
          text = path.read_text(encoding="utf-8")
          old = """        let mut manifest = manifest()?;
                  manifest.process_boundary = ProcessBoundary::InProcess;
                  assert_eq!(
                      manifest.validate().map_err(|error| error.code()),
          """
          new = """        let mut invalid_manifest = manifest()?;
                  invalid_manifest.process_boundary = ProcessBoundary::InProcess;
                  assert_eq!(
                      invalid_manifest.validate().map_err(|error| error.code()),
          """
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected manifest-shadowing block was not found")
          PY
          if ! git diff --quiet -- crates/fdir-adapter-sdk/src/protocol.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/fdir-adapter-sdk/src/protocol.rs
            git diff --cached --check
            git commit -m "fix: avoid manifest fixture shadowing"
            git push origin HEAD:agent/issue-12-adapter-process-boundary
          fi
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup override set 1.97.1
      - name: Record pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import json, platform; policy=json.load(open('quality/toolchain.json', encoding='utf-8')); print(platform.python_implementation(), platform.python_version()); print(json.dumps(policy, sort_keys=True))"
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Fetch admitted Rust dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Run clean full repository quality
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy off .
      - name: Demonstrate intentional gate failures
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --self-test-gates .
      - name: Build authoritative cache receipt
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy read-write --receipt reports/quality/full-cache-write.json .
      - name: Verify read-only cache equivalence
        env:
          FDIR_SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/quality.py --mode full --cache-policy read-only --receipt reports/quality/full-cache-read.json .
      - name: Archive machine-readable quality receipts and lockfile
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-quality-receipts-${{ github.sha }}
          path: |
            reports/quality/*.json
            .validation/quality-cache.json
            Cargo.lock
          if-no-files-found: warn
          retention-days: 90
      - name: Archive branch source for local validation
        if: always()
        shell: bash
        run: |
          tar --create --gzip \
            --file /tmp/fdir-issue-12-source.tar.gz \
            --exclude=.git \
            --exclude=.validation \
            --exclude=reports \
            .
      - name: Upload branch source for local validation
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-issue-12-source-${{ github.sha }}
          path: /tmp/fdir-issue-12-source.tar.gz
          if-no-files-found: error
          retention-days: 2
