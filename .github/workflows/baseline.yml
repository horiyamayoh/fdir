name: Issue 6 source export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/issue-6-quality-gates'
    name: export validated workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out Issue 6 branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.issue6-export \
            --exclude=.issue6-import \
            --exclude=.validation \
            --exclude=reports \
            -czf /tmp/fdir-source.tar.gz .
          sha256sum /tmp/fdir-source.tar.gz
      - name: Upload source archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: issue-6-source
          path: /tmp/fdir-source.tar.gz
          if-no-files-found: error
          retention-days: 1
