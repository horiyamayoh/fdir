name: Issue 8 staging branch cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    name: issue 8 / delete merged and staging branches
    if: github.event.pull_request.head.ref == 'agent/issue-8-materialize'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify merge and delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          merged_head='c656c0c94938be1968f4a92b9914bb158dfe7e86'
          git fetch origin main
          git merge-base --is-ancestor "$merged_head" origin/main
          for branch in \
            agent/issue-8-generated-domain-model \
            agent/issue-8-materialize
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
