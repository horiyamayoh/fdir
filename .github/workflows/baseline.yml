name: Issue 6 validated workspace import

on:
  pull_request:

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'agent/issue-6-quality-gates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Issue 6 branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/issue-6-quality-gates
      - name: Apply validated core quality archive
        shell: bash
        run: |
          set -euo pipefail
          cat .issue6-import/chunk-* | base64 --decode > /tmp/issue6-changes.tar.gz
          expected="$(cat .issue6-import/archive.sha256)"
          actual="$(sha256sum /tmp/issue6-changes.tar.gz | cut -d' ' -f1)"
          echo "expected=${expected}"
          echo "actual=${actual}"
          test "${actual}" = "${expected}"

          set +e
          gzip -dc /tmp/issue6-changes.tar.gz > /tmp/issue6-changes.tar
          gzip_status=$?
          set -e
          if [[ "${gzip_status}" -ne 0 ]]; then
            echo "::warning::gzip footer is damaged; validating the recovered tar before use"
          fi
          tar -tf /tmp/issue6-changes.tar

          message="$(cat .issue6-import/COMMIT_MESSAGE)"
          tar -xf /tmp/issue6-changes.tar -C .
          rm -rf .issue6-import .issue6-export
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "${message}"
          git push origin HEAD:agent/issue-6-quality-gates
