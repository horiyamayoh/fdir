name: Export agent checkout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/issue-11-sqlite-index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --create --gzip --file /tmp/fdir-checkout.tar.gz \
            --exclude=.git \
            --exclude=.agent-change \
            .
          sha256sum /tmp/fdir-checkout.tar.gz
      - name: Upload checkout
        uses: actions/upload-artifact@v7.0.1
        with:
          name: issue-11-checkout-${{ github.sha }}
          path: /tmp/fdir-checkout.tar.gz
          if-no-files-found: error
          retention-days: 2
