name: Export FDIR foundation review tree

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/export-foundation-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the foundation branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/finalize-development-foundation
          fetch-depth: 1

      - name: Upload the complete review tree
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-foundation-review-${{ github.sha }}
          path: |
            .
            !.git/**
            !.validation/**
            !reports/**
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
