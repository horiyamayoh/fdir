# Temporary API-only bootstrap; this workflow deletes itself before the implementation commit.
name: Bootstrap and validate Issue 12 implementation

on:
  push:
    branches:
      - agent/issue-12-adapter-process-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the prepared implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .issue-12.patch.gz.b64.00 \
            .issue-12.patch.gz.b64.01 \
            .issue-12.patch.gz.b64.02 \
            .issue-12.patch.gz.b64.03a \
            .issue-12.patch.gz.b64.03b \
            .issue-12.patch.gz.b64.03c \
            .issue-12.patch.gz.b64.03d \
            .issue-12.patch.gz.b64.04 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/issue-12.patch
          git apply --check /tmp/issue-12.patch
          git apply /tmp/issue-12.patch
          rm -- \
            .issue-12.patch.gz.b64.00 \
            .issue-12.patch.gz.b64.01 \
            .issue-12.patch.gz.b64.02 \
            .issue-12.patch.gz.b64.03a \
            .issue-12.patch.gz.b64.03b \
            .issue-12.patch.gz.b64.03c \
            .issue-12.patch.gz.b64.03d \
            .issue-12.patch.gz.b64.04 \
            .github/workflows/export-issue-12-checkout.yml

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup override set 1.97.1

      - name: Format Rust source
        id: format
        continue-on-error: true
        run: cargo fmt --all

      - name: Commit the implementation and remove bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            RUST.md \
            crates/fdir-adapter-sdk/src/lib.rs \
            crates/fdir-adapter-sdk/src/protocol.rs \
            crates/fdir-adapter-sdk/src/supervisor.rs \
            crates/fdir-adapter-sdk/tests/non_rust_worker.rs \
            crates/fdir-cli/src/lib.rs \
            crates/fdir-cli/tests/cli.rs \
            crates/fdir-coordinator/src/lib.rs \
            fixtures/adapter-protocol \
            machine/adapter-protocol.schema.json \
            machine/adapter-sandbox-receipt.schema.json \
            machine/adapter-worker-manifest.schema.json \
            quality/README.md \
            quality/adapter-protocol.json \
            quality/rust-workspace.json \
            references/adapter-protocol.md \
            tests/test_adapter_protocol.py \
            tools/adapter_protocol.py \
            tools/mock_adapter_worker.py
          git add -u -- \
            .github/workflows/export-issue-12-checkout.yml \
            .issue-12.patch.gz.b64.00 \
            .issue-12.patch.gz.b64.01 \
            .issue-12.patch.gz.b64.02 \
            .issue-12.patch.gz.b64.03a \
            .issue-12.patch.gz.b64.03b \
            .issue-12.patch.gz.b64.03c \
            .issue-12.patch.gz.b64.03d \
            .issue-12.patch.gz.b64.04
          git diff --cached --check
          git commit -m "feat: implement strict adapter process boundary"
          git push origin HEAD:agent/issue-12-adapter-process-boundary

      - name: Check the Rust workspace
        id: check
        continue-on-error: true
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Archive the formatted source tree
        if: always()
        shell: bash
        run: |
          tar --create --gzip \
            --file /tmp/fdir-issue-12-formatted.tar.gz \
            --exclude=.git \
            --exclude=.validation \
            --exclude=reports \
            .

      - name: Upload the formatted source tree
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdir-issue-12-formatted-${{ github.sha }}
          path: /tmp/fdir-issue-12-formatted.tar.gz
          if-no-files-found: error
          retention-days: 2

      - name: Fail on formatter or compiler diagnostics
        if: steps.format.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
