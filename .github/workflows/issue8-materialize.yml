name: Issue 8 staging materializer

on:
  push:
    branches:
      - agent/issue-8-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Configure deterministic commit identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize typed contract projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - ISSUE8_STAGE1_PAYLOAD . <<'PY'
          import base64
          import json
          import lzma
          import subprocess
          import sys
          from pathlib import Path

          marker = sys.argv[1].encode()
          root = Path(sys.argv[2]).resolve()
          messages = subprocess.check_output(
              ["git", "log", "--format=%B%x00"],
          ).split(b"\x00")
          for message in messages:
              lines = message.strip().splitlines()
              if lines and lines[0] == marker:
                  payload = b"".join(lines[1:])
                  files = json.loads(lzma.decompress(base64.b64decode(payload)))
                  for relative, content in sorted(files.items()):
                      path = root / relative
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(content, encoding="utf-8")
                  break
          else:
              raise SystemExit(f"missing payload commit: {marker.decode()}")
          PY
          chmod +x tools/generate_rust_contract.py
          python3 tools/generate_rust_contract.py .
          git add \
            tools/generate_rust_contract.py \
            crates/fdir-contract/src/generated.rs \
            crates/fdir-contract/src/lib.rs \
            crates/fdir-contract/src/schema.rs \
            crates/fdir-contract/src/value.rs \
            quality/rust-generated-contract.json
          git commit -m "Generate typed Rust contract projection"
      - name: Materialize validation and neutral operation state
        shell: bash
        run: |
          set -euo pipefail
          python3 - ISSUE8_STAGE2_PAYLOAD . <<'PY'
          import base64
          import json
          import lzma
          import subprocess
          import sys
          from pathlib import Path

          marker = sys.argv[1].encode()
          root = Path(sys.argv[2]).resolve()
          messages = subprocess.check_output(
              ["git", "log", "--format=%B%x00"],
          ).split(b"\x00")
          for message in messages:
              lines = message.strip().splitlines()
              if lines and lines[0] == marker:
                  payload = b"".join(lines[1:])
                  files = json.loads(lzma.decompress(base64.b64decode(payload)))
                  for relative, content in sorted(files.items()):
                      path = root / relative
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(content, encoding="utf-8")
                  break
          else:
              raise SystemExit(f"missing payload commit: {marker.decode()}")
          PY
          git add \
            crates/fdir-contract/src/lib.rs \
            crates/fdir-contract/src/validation.rs \
            crates/fdir-contract/tests/model_fixture_parity.rs \
            crates/fdir-core/src/foundation.rs \
            crates/fdir-core/src/lib.rs \
            fixtures/positive/extensions-and-statuses.json \
            tests/test_rust_model_contract.py \
            quality/rust-workspace.json
          git commit -m "Validate shared model invariants and explicit operation states"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup override set 1.97.1
      - name: Validate the complete staged tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_rust_contract.py --check .
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          export FDIR_SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 tools/quality.py --mode full --cache-policy off .
      - name: Publish materialized commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/issue-8-materialize
