name: Apply Issue 11 Clippy fix

on:
  push:
    branches:
      - agent/issue-11-sqlite-index

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/issue-11-sqlite-index
          fetch-depth: 0
          persist-credentials: true
      - name: Remove the unused collection import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fdir-storage/src/index.rs")
          source = path.read_text(encoding="utf-8")
          old = "use std::collections::{BTreeMap, BTreeSet};"
          new = "use std::collections::BTreeMap;"
          if old not in source:
              raise SystemExit("expected unused import was not present")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit and push the source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/fdir-storage/src/index.rs
          git commit -m "Fix strict Clippy failure in SQLite index"
          git push origin HEAD:refs/heads/agent/issue-11-sqlite-index
