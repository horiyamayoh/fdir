name: Temporary Issue 10 formatting

on:
  push:
    branches:
      - agent/issue-10-snapshot-storage

permissions:
  contents: write

concurrency:
  group: issue-10-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format / pinned-rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/issue-10-snapshot-storage
      - name: Install pinned rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup override set 1.97.1
      - name: Format and publish the source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "horiyamayoh"
          git config user.email "44720751+horiyamayoh@users.noreply.github.com"
          git add crates/fdir-storage/src
          git commit -m "Apply pinned Rust formatting"
          git push origin HEAD:agent/issue-10-snapshot-storage
