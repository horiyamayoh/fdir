name: Issue 6 workspace export

on:
  push:
    branches:
      - agent/issue-6-quality-gates

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
      - name: Export source as reviewable text chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .issue6-export
          mkdir .issue6-export
          git archive --format=tar.gz --output=/tmp/fdir-source.tar.gz HEAD -- . ':(exclude).issue6-export/**'
          base64 -w 0 /tmp/fdir-source.tar.gz | fold -w 8000 | split -l 1 - .issue6-export/chunk-
          sha256sum /tmp/fdir-source.tar.gz > .issue6-export/archive.sha256
          printf '%s\n' "${GITHUB_SHA}" > .issue6-export/source-sha
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .issue6-export
          git commit -m "Refresh Issue 6 workspace chunks [skip actions]"
          git push
