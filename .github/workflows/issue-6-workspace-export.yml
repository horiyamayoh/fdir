name: Issue 6 workspace import

on:
  push:
    branches:
      - agent/issue-6-quality-gates

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
      - name: Apply validated workspace archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .issue6-import/READY ]]; then
            echo "No complete Issue 6 import is staged."
            exit 0
          fi

          cat .issue6-import/part-* > /tmp/issue6-changes.tar.gz
          expected="$(cat .issue6-import/archive.sha256)"
          actual="$(sha256sum /tmp/issue6-changes.tar.gz | cut -d' ' -f1)"
          test "${actual}" = "${expected}"

          message="$(cat .issue6-import/COMMIT_MESSAGE)"
          remove_workflow=false
          if [[ -f .issue6-import/REMOVE_WORKFLOW ]]; then
            remove_workflow=true
          fi

          tar -xzf /tmp/issue6-changes.tar.gz -C .
          rm -rf .issue6-import .issue6-export
          if [[ "${remove_workflow}" = true ]]; then
            rm -f .github/workflows/issue-6-workspace-export.yml
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && {
            echo "Import archive produced no changes."
            exit 1
          }
          git commit -m "${message}"
          git push
