name: Recover interrupted agent change

on:
  push:
    branches:
      - agent/issue-11-sqlite-index
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and preserve saved payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-artifact/extracted
          cat .agent-change/part-* > recovery-artifact/agent-change.b64
          base64 --decode recovery-artifact/agent-change.b64 > recovery-artifact/agent-change.gz
          set +e
          gzip --decompress --stdout recovery-artifact/agent-change.gz > recovery-artifact/payload.partial
          gzip_status=$?
          set -e
          {
            echo "gzip-status=${gzip_status}"
            echo "base64-bytes=$(wc -c < recovery-artifact/agent-change.b64)"
            echo "gzip-bytes=$(wc -c < recovery-artifact/agent-change.gz)"
            echo "payload-bytes=$(wc -c < recovery-artifact/payload.partial)"
            sha256sum recovery-artifact/agent-change.gz recovery-artifact/payload.partial
            file recovery-artifact/payload.partial
          } | tee recovery-artifact/inspection.txt
          python3 - <<'PY' | tee -a recovery-artifact/inspection.txt
          from pathlib import Path
          data = Path('recovery-artifact/payload.partial').read_bytes()
          print('payload-prefix=', repr(data[:512]))
          print('payload-suffix=', repr(data[-512:]))
          PY
          if tar --list --file recovery-artifact/payload.partial > recovery-artifact/tar-list.txt 2> recovery-artifact/tar-error.txt; then
            echo 'payload-kind=complete-tar' | tee -a recovery-artifact/inspection.txt
          else
            echo 'payload-kind=plain-or-truncated-tar' | tee -a recovery-artifact/inspection.txt
            tar --extract --file recovery-artifact/payload.partial --directory recovery-artifact/extracted --ignore-zeros 2>> recovery-artifact/tar-error.txt || true
          fi
          find recovery-artifact/extracted -type f -print | sort > recovery-artifact/extracted-files.txt
          cat recovery-artifact/extracted-files.txt | tee -a recovery-artifact/inspection.txt
          tar --create --gzip --file recovery-artifact/source-tree.tar.gz \
            --exclude=.git \
            --exclude=recovery-artifact \
            .
      - name: Upload recovered payload and source tree
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: interrupted-issue-11-payload-${{ github.sha }}
          path: recovery-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
