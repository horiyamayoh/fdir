name: Apply interrupted issue 11 recovery

on:
  push:
    branches:
      - agent/issue-11-sqlite-index

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-11-sqlite-index
          fetch-depth: 0
          persist-credentials: true
      - name: Recover, verify, and commit the intact implementation files
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-change/part-* > /tmp/issue-11.b64
          base64 --decode /tmp/issue-11.b64 > /tmp/issue-11.gz
          set +e
          gzip --decompress --stdout /tmp/issue-11.gz > /tmp/issue-11.tar
          gzip_status=$?
          set -e
          test "$gzip_status" -eq 1
          rm -rf /tmp/issue-11-recovered
          mkdir -p /tmp/issue-11-recovered
          tar --extract --file /tmp/issue-11.tar --directory /tmp/issue-11-recovered --ignore-zeros || true

          files=(
            .github/workflows/baseline.yml
            .github/workflows/delete-merged-agent-branch.yml
            crates/fdir-storage/Cargo.toml
            crates/fdir-storage/src/index.rs
            crates/fdir-storage/src/index_tests.rs
            crates/fdir-storage/src/lib.rs
            machine/dependency-catalog.yaml
            quality/rust-workspace.json
            references/dependency-candidate-assessments.md
            references/sqlite-index.md
            schemas/fdir.sql
            schemas/generated-manifest.json
            tests/test_rust_workspace.py
          )
          for relative in "${files[@]}"; do
            test -s "/tmp/issue-11-recovered/${relative}"
            mkdir -p "$(dirname "$relative")"
            cp "/tmp/issue-11-recovered/${relative}" "$relative"
          done

          rm -rf .agent-change
          rm .github/workflows/recover-agent-change.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Recover rebuildable SQLite index implementation [recovery-applied]"
          git push origin HEAD:refs/heads/agent/issue-11-sqlite-index
