name: Document Form IR design validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate design authority
        run: python tools/validate_design.py
      - name: Run final release gate
        run: python tools/release_gate.py
      - name: Run real-input adapter E2E
        run: python tools/run_e2e.py --all
