name: Validate FDIR 2.1 baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deterministic authority and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_contracts.py --check .
          python3 tools/generate_traceability.py --check .
          python3 tools/validate_baseline.py .
          python3 -m py_compile tools/*.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=no)"
