name: Recover final foundation sources

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .foundation-bundle.part00
      - .foundation-bundle.part01
      - .foundation-bundle.part02
      - .foundation-bundle.part03
      - .github/workflows/apply-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-final-foundation
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/finalize-development-foundation
          fetch-depth: 0

      - name: Verify and recover the four foundation source files
        shell: bash
        run: |
          set -euo pipefail
          cat .foundation-bundle.part00 \
              .foundation-bundle.part01 \
              .foundation-bundle.part02 \
              .foundation-bundle.part03 \
            | base64 --decode > /tmp/fdir-foundation.tar.gz
          actual_sha256="$(sha256sum /tmp/fdir-foundation.tar.gz | awk '{print $1}')"
          test "${actual_sha256}" = '8af4c38b7eb465a64841cb95971f2157d8f0a0b8d7c9d91ecdfa45984d1f6c72'
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          expected = [
              "machine/implementation-policy.yaml",
              "machine/dependency-manifest.schema.json",
              "machine/dependency-catalog.yaml",
              "references/dependency-candidate-assessments.md",
          ]
          archive = "/tmp/fdir-foundation.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if names != expected:
                  raise SystemExit(f"unexpected archive member list: {names!r}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              bundle.extractall(path=".", members=members, filter="data")
          PY
          rm -f \
            .foundation-bundle.part00 \
            .foundation-bundle.part01 \
            .foundation-bundle.part02 \
            .foundation-bundle.part03 \
            .github/workflows/apply-foundation.yml
          git diff --check

      - name: Commit the recovered source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Recover final foundation policy sources (#32)'
          git push origin HEAD:agent/finalize-development-foundation
