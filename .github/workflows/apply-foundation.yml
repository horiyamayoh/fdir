name: Apply final foundation bundle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .foundation-bundle.part00
      - .foundation-bundle.part01
      - .foundation-bundle.part02
      - .foundation-bundle.part03
      - .github/workflows/apply-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-foundation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@v6.0.2
        with:
          ref: agent/finalize-development-foundation
          fetch-depth: 0

      - name: Verify, unpack, and validate the final foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .foundation-bundle.part00 \
              .foundation-bundle.part01 \
              .foundation-bundle.part02 \
              .foundation-bundle.part03 \
            | base64 --decode > /tmp/fdir-foundation.tar.gz
          actual_sha256="$(sha256sum /tmp/fdir-foundation.tar.gz | awk '{print $1}')"
          echo "FOUNDATION_BUNDLE_SHA256=${actual_sha256}"
          test "${actual_sha256}" = '8af4c38b7eb465a64841cb95971f2157d8f0a0b8d7c9d91ecdfa45984d1f6c72'
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/fdir-foundation.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name}")
          PY
          tar -xzf /tmp/fdir-foundation.tar.gz
          rm -f \
            .foundation-bundle.part00 \
            .foundation-bundle.part01 \
            .foundation-bundle.part02 \
            .foundation-bundle.part03 \
            .github/workflows/apply-foundation.yml
          python3 tools/validate_implementation_policy.py --check --self-test --json .
          python3 -m unittest tests/test_implementation_policy.py -v
          python3 tools/generate_traceability.py --check .
          python3 tools/quality.py --mode full --cache-policy off .

      - name: Commit the validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Finalize issue-driven development foundation (#32)'
          git push origin HEAD:agent/finalize-development-foundation
