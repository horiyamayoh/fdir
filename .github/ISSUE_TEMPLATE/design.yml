name: Document Form IR design or implementation
description: Propose bounded work against the new Document Form IR plan.
title: "[DFIR] "
body:
  - type: input
    id: issue-key
    attributes:
      label: Issue plan key
      description: Use a key from machine/issue-plan.json, for example DFIR-I-007.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Owned requirements
      description: List exact DFIR-* requirement IDs and acceptance families.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Describe paths, dependencies, and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: State executable expected outputs, invariants, or stable diagnostics.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary checklist
      options:
        - label: No semantic interpretation or semantic equivalence.
          required: true
        - label: No source-byte archive or content-addressed source store.
          required: true
        - label: No free property bag or untyped predicate/value field.
          required: true
        - label: Non-success conversion states remain explicit.
          required: true
