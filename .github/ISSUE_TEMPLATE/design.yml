name: FDIR product change or bug
description: Propose a change within the Document Form IR product boundary.
title: "[FDIR] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Product behavior
      description: Describe the observed behavior, expected behavior, and affected format or command.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and reproduction
      description: Include inputs, commands, diagnostics, and relevant schema or adapter paths.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: State the product assertions and regression cases that should pass.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: No business meaning or semantic equivalence is added to the IR.
          required: true
        - label: Unsupported and partial conversion states remain explicit diagnostics.
          required: true
        - label: The standard unittest discovery command covers the change.
          required: true
