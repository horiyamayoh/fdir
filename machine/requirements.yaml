{
  "requirements": [
    {
      "id": "FDIR-AUTH-001",
      "level": "must",
      "text": "machine/logical-model.yaml and the pinned contract generator jointly define the core logical contract."
    },
    {
      "id": "FDIR-AUTH-002",
      "level": "must",
      "text": "Generated contracts are normative only when byte-identical to deterministic regeneration."
    },
    {
      "id": "FDIR-AUTH-003",
      "level": "must",
      "text": "Generated review projections and binary qualification artifacts are non-canonical."
    },
    {
      "id": "FDIR-MODEL-001",
      "level": "must",
      "text": "InformationUnit is an identity and construction anchor, not a substantive-content container."
    },
    {
      "id": "FDIR-MODEL-002",
      "level": "must",
      "text": "Substantive recorded information is expressed by RecordAssertion with explicit status and evidence links."
    },
    {
      "id": "FDIR-MODEL-003",
      "level": "must",
      "text": "AcceptedProjection is derivable exclusively from accepted assertions and cannot replace them."
    },
    {
      "id": "FDIR-EVID-001",
      "level": "must",
      "text": "Evidence entities remain separate from recorded-information entities."
    },
    {
      "id": "FDIR-EVID-002",
      "level": "must",
      "text": "Every accepted recorded assertion retains at least one source occurrence unless a diagnostic explains the absence."
    },
    {
      "id": "FDIR-EVID-003",
      "level": "must",
      "text": "Format-specific vocabulary remains in carriers, selectors, occurrences, observations, and adapters."
    },
    {
      "id": "FDIR-ACCT-001",
      "level": "must",
      "text": "Every independently inventoried source item receives exactly one accounting disposition."
    },
    {
      "id": "FDIR-ACCT-002",
      "level": "must",
      "text": "Accounting closure is checked against an independently produced census receipt where the profile requires it."
    },
    {
      "id": "FDIR-ACCT-003",
      "level": "must",
      "text": "Unsupported, unreadable, residual, and policy-excluded items remain visible."
    },
    {
      "id": "FDIR-COMP-001",
      "level": "must",
      "text": "Completeness is represented as a guarantee-profile status vector, not one boolean."
    },
    {
      "id": "FDIR-COMP-002",
      "level": "must",
      "text": "Partial, unsupported, unresolved, cancelled, and failed states are not rewritten as success."
    },
    {
      "id": "FDIR-EQ-001",
      "level": "must",
      "text": "Equivalence decisions are profile-scoped and evidence-backed."
    },
    {
      "id": "FDIR-EQ-002",
      "level": "must",
      "text": "Insufficient coverage yields indeterminate and cannot yield equivalent."
    },
    {
      "id": "FDIR-ID-001",
      "level": "must",
      "text": "Canonical serialization is deterministic and content digests are computed over canonical bytes."
    },
    {
      "id": "FDIR-ID-002",
      "level": "must",
      "text": "Unit identity, cross-format equivalence, and cross-revision continuity remain distinct."
    },
    {
      "id": "FDIR-VAL-001",
      "level": "must",
      "text": "The repository exposes one deterministic baseline validation command using standard Python only."
    },
    {
      "id": "FDIR-VAL-002",
      "level": "must",
      "text": "Positive examples validate and registered negative fixtures fail for their expected reason."
    },
    {
      "id": "FDIR-VAL-003",
      "level": "must",
      "text": "Every normative requirement is linked to at least one executable acceptance test."
    },
    {
      "id": "FDIR-CLAIM-001",
      "level": "must",
      "text": "The normative baseline does not claim that production converters are implemented or qualified."
    },
    {
      "id": "FDIR-PKG-001",
      "level": "must",
      "text": "Packaging notes distinguish canonical source from generated PDF, DOCX, PNG, indexes, reports, and binary qualification artifacts."
    }
  ],
  "version": "2.1.0"
}
