{"schema":"fdir/release-blocker-policy/1","releaseLine":"2.1.x","scopeRevision":1,"severities":[{"id":"critical","releaseBlocking":true,"scope":"release-wide","resolutionPolicy":"Fix and regression-qualify before release. Claim narrowing or a waiver cannot conceal a normative-baseline violation, security compromise, or irreversible information loss."},{"id":"high","releaseBlocking":true,"scope":"affected-tuples-and-release","resolutionPolicy":"Fix and requalify, or narrow the affected claim through an auditable project-owner-approved scope revision without weakening the FDIR 2.1 baseline."},{"id":"medium","releaseBlocking":"conditional","scope":"affected-tuples","blockConditions":["required-behavior","security-or-privacy-risk","accounting-gap","unexplained-determinism-or-evidence-gap"],"resolutionPolicy":"Treat as release-blocking when any block condition applies; otherwise record an explicit owner-approved residual risk, limitation, and qualification impact."},{"id":"low","releaseBlocking":false,"scope":"tracked-quality-debt","resolutionPolicy":"Record an owner, rationale, bounded follow-up, and proof that no production claim or required behavior is affected."},{"id":"informational","releaseBlocking":false,"scope":"observation","resolutionPolicy":"Record when useful for auditability; it must not be used to relabel an unresolved higher-severity condition."}],"gapIntake":{"roadmapIssue":4,"scopeIssue":5,"newRequirementRequiresStableId":true,"newRequirementRequiresOwningIssue":true,"roadmapUpdateRequired":true,"traceabilityUpdateRequired":true,"scopeImpactRequiresRevisionIncrement":true,"scopeImpactRequiresProjectOwnerApproval":true,"closureRequiresEvidence":true}}
