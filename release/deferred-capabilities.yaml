{"schema":"fdir/deferred-capabilities/1","releaseLine":"2.1.x","scopeRevision":1,"capabilities":[{"id":"legacy-binary-office-doc-xls","rationale":"The 2.1 production scope is limited to DOCX and XLSX package formats; binary Office parsing requires separate evidence, threat modeling, and qualification.","futureOwner":"unassigned","productionReady":false},{"id":"powerpoint-pptx","rationale":"PPTX is a distinct presentation carrier family and is not required by the frozen four-format release scope.","futureOwner":"unassigned","productionReady":false},{"id":"editable-source-regeneration","rationale":"Archival recovery of original bytes does not prove neutral-IR-to-editable-document inversion; writers require independent fidelity profiles and qualification.","futureOwner":"unassigned","productionReady":false},{"id":"macro-or-embedded-code-execution","rationale":"FDIR may inventory active content but the 2.1 release will not execute document macros, scripts, or embedded programs.","futureOwner":"unassigned","productionReady":false},{"id":"unrestricted-external-resource-dereference","rationale":"Network and linked-resource access remain policy-controlled and offline by default; unrestricted retrieval is outside the security model.","futureOwner":"unassigned","productionReady":false},{"id":"business-truth-or-requirement-validity","rationale":"FDIR records documentary information and evidence; downstream domain compilers own truth, consistency, and requirement-validity judgments.","futureOwner":"unassigned","productionReady":false},{"id":"hosted-multi-tenant-collaboration-service","rationale":"The approved release architecture is a local/offline product surface; hosted tenancy and collaboration require separate operational controls.","futureOwner":"unassigned","productionReady":false},{"id":"encrypted-document-credential-recovery","rationale":"FDIR may accept authorized credentials under policy but does not bypass encryption, permissions, or recover unknown credentials.","futureOwner":"unassigned","productionReady":false},{"id":"ocr-or-vision-semantic-certainty","rationale":"OCR and visual inference are evidence-backed observations with confidence and limitations, not guaranteed source-declared truth.","futureOwner":"unassigned","productionReady":false}]}
